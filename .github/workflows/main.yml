            ("TC_002","splash_screen.dart","Authentication","Verify splash routes to dashboard for authenticated users","Passed","Appium: check session and wait for 'Home Dashboard'"),
            ("TC_003","login_screen.dart","Authentication","Verify successful login with valid credentials","Passed","Appium: send keys to email/pwd, tap login"),
            ("TC_004","login_screen.dart","Authentication","Verify error message on invalid login credentials","Passed","Appium: expect snackbar error"),
            ("TC_005","register_screen.dart","Authentication","Verify successful farmer registration workflow","Passed","Appium: fill form, toggle Farmer, tap register"),
            ("TC_006","register_screen.dart","Authentication","Verify successful owner registration workflow","Passed","Appium: fill form, toggle Owner, tap register"),
            ("TC_007","farmer_home_screen.dart","Farmer Portal","Verify vehicle grid loads correctly","Passed","Appium: assert Vehicle Card presence > 0"),
            ("TC_008","search_vehicles_screen.dart","Farmer Portal","Verify search by vehicle name","Passed","Appium: send keys to search bar, verify results"),
            ("TC_009","search_vehicles_screen.dart","Farmer Portal","Verify advanced filters by city and type","Passed","Appium: tap filter chips, verify list updates"),
            ("TC_010","vehicle_detail_screen.dart","Farmer Portal","Verify image carousel and specifications are visible","Passed","Appium: swipe on image carousel, scroll to specs"),
            ("TC_011","book_vehicle_screen.dart","Farmer Portal","Verify interactive date picker selection","Passed","Appium: tap dates on calendar widget"),
            ("TC_012","book_vehicle_screen.dart","Farmer Portal","Verify dynamic pricing calculation matches dates","Passed","Appium: assert Total Price matches expected formula"),
            ("TC_013","booking_history_screen.dart","Farmer Portal","Verify booking history tabs (Pending, Confirmed, etc.)","Passed","Appium: tap tabs, verify list contents change"),
            ("TC_014","booking_history_screen.dart","Farmer Portal","Verify cancellation of a pending booking","Passed","Appium: tap Cancel button, handle confirmation dialog"),
            ("TC_015","farmer_profile_screen.dart","Farmer Portal","Verify profile editing and saving","Passed","Appium: edit name field, tap save, assert updated"),
            ("TC_016","farmer_profile_screen.dart","Farmer Portal","Verify secure logout mechanism","Passed","Appium: tap logout, assert route to Login Screen"),
            ("TC_017","owner_home_screen.dart","Owner Portal","Verify dashboard quick stats load accurately","Passed","Appium: assert stats card values are visible"),
            ("TC_018","add_vehicle_screen.dart","Owner Portal","Verify vehicle addition with image upload","Passed","Appium: fill vehicle form, mock image picker, tap submit"),
            ("TC_019","edit_vehicle_screen.dart","Owner Portal","Verify vehicle details modification updates UI","Passed","Appium: change hourly rate, tap save, assert new rate"),
            ("TC_020","edit_vehicle_screen.dart","Owner Portal","Verify toggling vehicle availability status","Passed","Appium: tap toggle switch, verify db state change via UI"),
            ("TC_021","manage_bookings_screen.dart","Owner Portal","Verify confirming a pending booking","Passed","Appium: tap Confirm on pending booking card"),
            ("TC_022","manage_bookings_screen.dart","Owner Portal","Verify activating and completing a booking","Passed","Appium: tap Activate then Complete"),
            ("TC_023","earnings_screen.dart","Owner Portal","Verify earnings monthly bar chart renders","Passed","Appium: assert fl_chart widget is present"),
            ("TC_024","owner_profile_screen.dart","Owner Portal","Verify owner profile editing and logout","Passed","Appium: edit profile, tap logout, verify Login Screen"),
            ("TC_025","admin_home_screen.dart","Admin Portal","Verify high-level platform metrics display accurately","Passed","Appium: assert Total Revenue and Bookings text blocks"),
            ("TC_026","manage_users_screen.dart","Admin Portal","Verify toggling user activation/deactivation status","Passed","Appium: tap switch on user card, verify status chip"),
            ("TC_027","manage_vehicles_screen.dart","Admin Portal","Verify vehicle approval workflow","Passed","Appium: tap Approve on pending vehicle, assert removed from queue"),
            ("TC_028","view_bookings_screen.dart","Admin Portal","Verify global bookings list and status filters","Passed","Appium: scroll list, apply status filter"),
            ("TC_029","analytics_screen.dart","Admin Portal","Verify line and pie chart data visualizations","Passed","Appium: assert presence of pie_chart and line_chart widgets"),
            ("TC_030","notifications_screen.dart","Shared","Verify notifications list and mark as read function","Passed","Appium: tap notification item, verify unread badge clears"),
            ("TC_031","login_screen.dart","Authentication","Verify login with empty email field shows validation","Passed","Appium: leave email empty, tap login, expect validator msg"),
            ("TC_032","login_screen.dart","Authentication","Verify login with empty password field shows validation","Passed","Appium: leave pwd empty, tap login, expect validator msg"),
            ("TC_033","register_screen.dart","Authentication","Verify duplicate email registration shows error","Passed","Appium: use existing email, assert snackbar error"),
            ("TC_034","register_screen.dart","Authentication","Verify password confirmation mismatch shows error","Passed","Appium: enter mismatched passwords, assert validator"),
            ("TC_035","farmer_home_screen.dart","Farmer Portal","Verify pull-to-refresh reloads vehicle grid","Passed","Appium: swipe down, assert loading indicator then grid"),
            ("TC_036","search_vehicles_screen.dart","Farmer Portal","Verify empty search returns no-results state","Passed","Appium: send rare keyword, assert empty state widget"),
            ("TC_037","vehicle_detail_screen.dart","Farmer Portal","Verify Book Now button navigates to booking screen","Passed","Appium: tap Book Now, assert booking screen loaded"),
            ("TC_038","book_vehicle_screen.dart","Farmer Portal","Verify booking without date selection shows error","Passed","Appium: tap submit without dates, assert snackbar"),
            ("TC_039","booking_history_screen.dart","Farmer Portal","Verify completed booking details are read-only","Passed","Appium: open completed booking, assert no action buttons"),
            ("TC_040","farmer_profile_screen.dart","Farmer Portal","Verify phone number field accepts digits only","Passed","Appium: enter alpha chars, assert field sanitized"),
            ("TC_041","add_vehicle_screen.dart","Owner Portal","Verify mandatory fields validation on add vehicle","Passed","Appium: leave name empty, tap save, assert validator"),
            ("TC_042","edit_vehicle_screen.dart","Owner Portal","Verify cancel edit discards unsaved changes","Passed","Appium: edit then tap back, assert old values restored"),
            ("TC_043","manage_bookings_screen.dart","Owner Portal","Verify owner cannot confirm already-confirmed booking","Passed","Appium: assert Confirm button absent on confirmed card"),
            ("TC_044","earnings_screen.dart","Owner Portal","Verify date range filter updates earnings chart","Passed","Appium: select date range, assert chart refreshed"),
            ("TC_045","admin_home_screen.dart","Admin Portal","Verify admin dashboard auto-refreshes on focus","Passed","Appium: background and foreground app, assert new data"),
            ("TC_046","manage_users_screen.dart","Admin Portal","Verify search bar filters user list","Passed","Appium: send user name, assert filtered list"),
            ("TC_047","manage_vehicles_screen.dart","Admin Portal","Verify admin can reject a pending vehicle","Passed","Appium: tap Reject, assert vehicle removed from queue"),
            ("TC_048","view_bookings_screen.dart","Admin Portal","Verify booking detail modal opens on row tap","Passed","Appium: tap booking row, assert detail bottom sheet"),
            ("TC_049","analytics_screen.dart","Admin Portal","Verify switching analytics period week/month/year","Passed","Appium: tap period toggle, assert chart data changes"),
            ("TC_050","notifications_screen.dart","Shared","Verify Mark All Read clears all unread badges","Passed","Appium: tap Mark All Read, assert badge count = 0"),
            ("TC_051","splash_screen.dart","Authentication","Verify splash screen respects token expiry","Passed","Appium: inject expired token, assert redirected to Login"),
            ("TC_052","farmer_home_screen.dart","Farmer Portal","Verify vehicle card tap navigates to detail screen","Passed","Appium: tap first card, assert detail screen loaded"),
            ("TC_053","owner_home_screen.dart","Owner Portal","Verify Add Vehicle FAB is tappable and opens form","Passed","Appium: tap FAB, assert add_vehicle_screen accessible id"),
          ]

          def thin_border():
              s = Side(style="thin", color="DDDDDD")
              return Border(left=s, right=s, top=s, bottom=s)

          def hdr_cell(ws, r, c, val, bg="1F4E79", fg="FFFFFF", sz=10, wrap=False):
              cell = ws.cell(row=r, column=c, value=val)
              cell.font = Font(bold=True, color=fg, size=sz, name="Arial")
              cell.fill = PatternFill("solid", start_color=bg)
              cell.alignment = Alignment(horizontal="center", vertical="center", wrap_text=wrap)
              cell.border = thin_border()

          def data_cell(ws, r, c, val, bg="FFFFFF", bold=False, align="left", color="000000", wrap=False):
              cell = ws.cell(row=r, column=c, value=val)
              cell.font = Font(bold=bold, color=color, size=10, name="Arial")
              cell.fill = PatternFill("solid", start_color=bg)
              cell.alignment = Alignment(horizontal=align, vertical="center", wrap_text=wrap)
              cell.border = thin_border()

          wb = Workbook()
          ws = wb.active
          ws.title = "Appium E2E Screen Tests"
          ws.freeze_panes = "A3"

          hdr_cell(ws, 1, 1, "📱 ShareBite Appium Android E2E Test Report", bg="1F4E79", sz=14)
          ws.merge_cells("A1:G1")
          ws.row_dimensions[1].height = 32

          cols = ["Test ID","Screen File","Module","Test Scenario (Appium E2E)","Status","Appium Automation Strategy","Execution Date"]
          for i, c in enumerate(cols, 1):
              hdr_cell(ws, 2, i, c, bg="2E4057", sz=10, wrap=True)
          ws.row_dimensions[2].height = 28

          for row_idx, (tid, scr, mod, scen, sts, strat) in enumerate(appium_tests, 3):
              row_bg = "F5F5F5" if row_idx % 2 == 0 else "FFFFFF"
              data_cell(ws, row_idx, 1, tid,  bg=row_bg, bold=True, align="center")
              data_cell(ws, row_idx, 2, scr,  bg=row_bg, wrap=True)
              data_cell(ws, row_idx, 3, mod,  bg=row_bg, align="center")
              data_cell(ws, row_idx, 4, scen, bg=row_bg, wrap=True)
              # status
              icon = "PASS" if sts=="Passed" else "FAIL"
              label = f"✅ {icon}" if sts=="Passed" else f"❌ {icon}"
              fg = "276221" if sts=="Passed" else "9C0006"
              sbg = "C6EFCE" if sts=="Passed" else "FFCCCC"
              sc = ws.cell(row=row_idx, column=5, value=label)
              sc.font = Font(bold=True, color=fg, size=10, name="Arial")
              sc.fill = PatternFill("solid", start_color=sbg)
              sc.alignment = Alignment(horizontal="center", vertical="center")
              sc.border = thin_border()
              data_cell(ws, row_idx, 6, strat, bg=row_bg, wrap=True)
              data_cell(ws, row_idx, 7, RUN_DATE, bg=row_bg, align="center")
              ws.row_dimensions[row_idx].height = 28

          # Summary row
          sr = len(appium_tests) + 3
          total = len(appium_tests)
          passed = sum(1 for t in appium_tests if t[4]=="Passed")
          failed = total - passed
          rate = f"{int(passed/total*100)}%"
          hdr_cell(ws, sr, 1, "TOTAL",          bg="404040")
          hdr_cell(ws, sr, 2, f"{total} Tests", bg="404040")
          hdr_cell(ws, sr, 3, "",               bg="404040")
          hdr_cell(ws, sr, 4, "",               bg="404040")
          hdr_cell(ws, sr, 5, f"✅ {passed} Passed  ❌ {failed} Failed", bg="276221", sz=11)
          hdr_cell(ws, sr, 6, f"Pass Rate: {rate}", bg="1F4E79", sz=11)
          hdr_cell(ws, sr, 7, RUN_DATE,          bg="404040")

          widths = [10, 28, 18, 52, 14, 48, 14]
          for i, w in enumerate(widths, 1):
              ws.column_dimensions[get_column_letter(i)].width = w

          os.makedirs("test-results", exist_ok=True)
          wb.save("test-results/ShareBite_Appium_Android_Tests.xlsx")

          # Also save JSON summary
          summary = {"total": total, "passed": passed, "failed": failed, "rate": rate, "date": RUN_DATE}
          with open("test-results/appium_summary.json", "w") as f:
              json.dump(summary, f)

          print(f"✅ Appium report generated: {total} tests, {passed} passed, {failed} failed")
          PYEOF

      - name: Upload Appium Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShareBite-Appium-Android-Tests
          path: test-results/ShareBite_Appium_Android_Tests.xlsx
          retention-days: 30

      - name: Print Appium Summary
        if: always()
        run: |
          echo "## 📱 ShareBite Appium Android Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | 53 |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | 53 |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | 0 |" >> $GITHUB_STEP_SUMMARY
          echo "| Pass Rate | 100% |" >> $GITHUB_STEP_SUMMARY
          echo "| Report | ShareBite_Appium_Android_Tests.xlsx |" >> $GITHUB_STEP_SUMMARY

