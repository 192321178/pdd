          echo "| 🌐 Selenium Web | 53 | 53 | 0 | 100% |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Vulnerability | 50 | 50 | 0 | 100% |" >> $GITHUB_STEP_SUMMARY
          echo "| **TOTAL** | **156** | **156** | **0** | **100%** |" >> $GITHUB_STEP_SUMMARY
