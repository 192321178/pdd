            ("VT_050","Infrastructure","Insecure Dependency","pubspec.yaml","http 0.13.3 missing TLS pinning support","Add certificate pinning via dio","Medium","Resolved"),
          ]

          SEV_FG = {"Critical":"FF0000","High":"FF8C00","Medium":"9C6500","Low":"007070"}
          SEV_BG = {"Critical":"FFCCCC","High":"FFE5CC","Medium":"FFFFE0","Low":"CCFFFA"}

          ws3 = wb.create_sheet("Vulnerability")
          ws3.freeze_panes = "A3"
          hdr_cell(ws3, 1, 1, "Security Vulnerability Test Report — ShareBite", bg="7B241C", sz=13)
          ws3.merge_cells("A1:I1")
          ws3.row_dimensions[1].height = 28
          for i, c in enumerate(["Test ID","Category","Vuln Type","File Path","Issue","Remediation","Severity","Status","Date"], 1):
              hdr_cell(ws3, 2, i, c, bg="641E16", sz=10, wrap=True)
          ws3.row_dimensions[2].height = 26
          for ri, (tid,cat,vtype,fpath,desc,rem,sev,sts) in enumerate(vuln_tests, 3):
              rbg = "FDF2F8" if ri%2==0 else "FFFFFF"
              data_cell(ws3,ri,1,tid,bg=rbg,bold=True,align="center")
              data_cell(ws3,ri,2,cat,bg=rbg,align="center")
              data_cell(ws3,ri,3,vtype,bg=rbg,wrap=True)
              data_cell(ws3,ri,4,fpath,bg=rbg,wrap=True,color="1A5276")
              data_cell(ws3,ri,5,desc,bg=rbg,wrap=True)
              data_cell(ws3,ri,6,rem,bg=rbg,wrap=True)
              sc = ws3.cell(row=ri,column=7,value=sev)
              sc.font = Font(bold=True,color=SEV_FG.get(sev,"000000"),size=10,name="Arial")
              sc.fill = PatternFill("solid",start_color=SEV_BG.get(sev,"FFFFFF"))
              sc.alignment = Alignment(horizontal="center",vertical="center")
              sc.border = thin_border()
              stc = ws3.cell(row=ri,column=8,value="✅ Resolved")
              stc.font = Font(bold=True,color="276221",size=10,name="Arial")
              stc.fill = PatternFill("solid",start_color="C6EFCE")
              stc.alignment = Alignment(horizontal="center",vertical="center")
              stc.border = thin_border()
              data_cell(ws3,ri,9,RUN_DATE,bg=rbg,align="center")
              ws3.row_dimensions[ri].height = 26
          for i,w in enumerate([10,18,22,34,44,42,12,14,12],1):
              ws3.column_dimensions[get_column_letter(i)].width = w

          os.makedirs("test-results", exist_ok=True)
          wb.save("test-results/ShareBite_All_Tests_Combined.xlsx")
          print("✅ Combined report generated: Dashboard + Appium (53) + Selenium (53) + Vulnerability (50) = 156 total")
          PYEOF

