name: ShareBite CI — Build, Test & Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ──────────────────────────────────────────────────────────────────────────────
jobs:

# ╔══════════════════════════════════════════════════════════════════╗
# ║  JOB 1 — Android Build & Test                                   ║
# ╚══════════════════════════════════════════════════════════════════╝
  android-build:
    name: "📱 Android Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2g --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=false"

      - name: Run Unit Tests
        run: |
          ./gradlew test \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED"
        continue-on-error: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShareBite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

# ╔══════════════════════════════════════════════════════════════════╗
# ║  JOB 2 — Web Validation                                         ║
# ╚══════════════════════════════════════════════════════════════════╝
  web-validation:
    name: "🌐 Web Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check web folder structure
        run: |
          echo "=== Web folder check ==="
          if [ -d "web" ]; then
            echo "✅ web/ folder found"
            ls -la web/
          else
            echo "⚠️  web/ folder not found — skipping"
          fi

      - name: Check index.html
        run: |
          if [ -f "web/index.html" ]; then
            echo "✅ web/index.html found"
          else
            echo "⚠️  web/index.html not found"
          fi

# ╔══════════════════════════════════════════════════════════════════╗
# ║  JOB 3 — Appium Android Tests (53 tests)                        ║
# ╚══════════════════════════════════════════════════════════════════╝
  appium-android-tests:
    name: "📱 Appium Android Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Run Appium Android E2E Tests & Generate Report
        run: |
