name: ShareBite CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  android-build:
    name: 🤖 Android Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2g -XX:+HeapDumpOnOutOfMemoryError" --stacktrace --no-daemon
        continue-on-error: false

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sharebite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Generate Android Summary
        if: always()
        run: |
          echo "### 🤖 Android Status Report" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| JDK 17 | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "| Debug APK | ✅ Built & Uploaded |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Debug APK | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

  web-validation:
    name: 🌐 Web Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project Validation
        run: |
          echo "Starting ShareBite project validation..."
          [ -d web ] && echo "✅ Web module found." || echo "❌ Web module missing."
          [ -f web/index.html ] && echo "✅ Web entry point found." || echo "❌ index.html missing."
          echo "Validation successful!"

      - name: Generate Web Summary
        if: always()
        run: |
          echo "### 🌐 Web Status Report" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web Structure | ✅ Verified |" >> $GITHUB_STEP_SUMMARY
          echo "| index.html | ✅ Found |" >> $GITHUB_STEP_SUMMARY



