name: ShareBite CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  android-build:
    name: 🤖 Android Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2g -XX:+HeapDumpOnOutOfMemoryError" --stacktrace --no-daemon
        continue-on-error: false

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sharebite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Generate Android Summary
        if: always()
        run: |
          echo "## 📊 ShareBite CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Here is the real-time breakdown of the Android build and validation process:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Step | Action Performed | Result | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|-------------------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 Android | Setup | Configure JDK 17 | ℹ️ INFO | Temurin distribution |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "| 🤖 Android | Build | Run assembleDebug | ✅ PASS | Gradle build successful |" >> $GITHUB_STEP_SUMMARY
            echo "| 🤖 Android | Artifact | Upload Debug APK | ✅ PASS | Artifact available: sharebite-debug-apk |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🤖 Android | Build | Run assembleDebug | ❌ FAIL | Build failure detected |" >> $GITHUB_STEP_SUMMARY
            echo "| 🤖 Android | Artifact | Upload Debug APK | ⚠️ SKIP | Artifact not generated |" >> $GITHUB_STEP_SUMMARY
          fi

  web-validation:
    name: 🌐 Web Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project Validation
        id: web_check
        run: |
          echo "Starting ShareBite project validation..."
          if [ -d web ]; then echo "web_dir=exists" >> $GITHUB_OUTPUT; else echo "web_dir=missing" >> $GITHUB_OUTPUT; fi
          if [ -f web/index.html ]; then echo "index_html=found" >> $GITHUB_OUTPUT; else echo "index_html=missing" >> $GITHUB_OUTPUT; fi

      - name: Generate Web Summary
        if: always()
        run: |
          echo "## 🌐 ShareBite Web Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "Review the structural verification of the web module assets:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Component | Check Performed | Result | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|------------------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.web_check.outputs.web_dir }}" = "exists" ]; then
            echo "| 🌐 Web | Directory | Scan for /web folder | ✅ PASS | Web module identified |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🌐 Web | Directory | Scan for /web folder | ❌ FAIL | Web module missing |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.web_check.outputs.index_html }}" = "found" ]; then
            echo "| 🌐 Web | Entry Point | Validate index.html | ✅ PASS | Entry point verified |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🌐 Web | Entry Point | Validate index.html | ❌ FAIL | index.html not found |" >> $GITHUB_STEP_SUMMARY
          fi



